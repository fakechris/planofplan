<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>planofplan</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <div class="brand-lockup">
      <span class="brand-mark">P</span>
      <div>
        <div class="brand">planofplan</div>
        <div class="brand-caption">quota command center</div>
      </div>
    </div>
    <div class="header-meta">
      <span id="buildIdentity" class="build-identity" title="当前运行构建"></span>
      <span id="connectionState" class="connection"><i></i> live</span>
      <span id="generatedAt" class="muted"></span>
      <button id="startupToggle" class="startup-toggle" type="button" hidden aria-pressed="false"
        title="登录时自动启动 daemon（launchd 守护，崩溃自动重启）。关闭后注销/重启不再自启，当前服务不受影响。">开机自启</button>
      <button id="refreshBtn" class="button-primary" type="button">刷新全部</button>
    </div>
  </header>

  <section class="hero">
    <div>
      <p class="eyebrow">SUBSCRIPTION TELEMETRY</p>
      <h1>额度运行态</h1>
      <p class="hero-copy">在一个视图里监控所有 coding plans 的消耗、凭据和恢复窗口。</p>
    </div>
    <div id="heroClock" class="hero-clock"></div>
  </section>

  <section id="summary" class="summary"></section>

  <section class="usage-section">
    <div class="section-head">
      <div>
        <p class="eyebrow">USAGE &amp; SPEND</p>
        <h2>Token 消耗</h2>
      </div>
      <div class="usage-actions">
        <button id="usageScanBtn" class="secondary-btn" type="button">扫描本地日志</button>
        <label class="usage-range">范围
          <select id="usageDays" aria-label="Token usage 时间范围">
            <option value="7">7 天</option>
            <option value="30" selected>30 天</option>
            <option value="90">90 天</option>
            <option value="365">365 天</option>
          </select>
        </label>
      </div>
    </div>
    <div id="usageReport" class="usage-report"></div>
  </section>

  <main id="grid" class="grid"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <template id="winTpl">
    <div class="win">
      <div class="win-head">
        <span class="win-label"></span>
        <span class="win-meta"></span>
      </div>
      <div class="track"><div class="fill"></div></div>
      <div class="win-foot">
        <span class="win-reset"></span>
        <span class="win-countdown" data-reset-at></span>
        <span class="win-note"></span>
      </div>
    </div>
  </template>

  <script src="/app.js"></script>
</body>
</html>
